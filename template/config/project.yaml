project:
  name: "template"
  description: "repo template"
  repository: "repo-template"
  organization: "Facu-HomeLab"

container:
  registry: "reg.internal.facuynati.website"
  harbor_project: "applications"
  image: "template"
  port: 3000

deployment:
  provider: docker-compose

  dev:
    enabled: true
    hostname: "template.dev.facuynati.website"
    environment: development
    target: "proxmox-dev"

  prod:
    enabled: true
    hostname: "template.facuynati.website"
    environment: production
    target: "proxmox-prod"

healthcheck:
  path: "/health"
  interval: 30
