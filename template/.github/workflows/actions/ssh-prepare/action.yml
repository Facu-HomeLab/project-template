name: Prepare deployment SSH
description: Install temporary SSH key and pinned known_hosts file.
inputs:
  secret_file: { required: true }
outputs:
  ssh_dir: 
    value: ${{ steps.prepare.outputs.ssh_dir }}
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        SECRET_FILE: ${{ inputs.secret_file }}
      run: |
        set -Eeuo pipefail
        source "$GITHUB_ACTION_PATH/../../scripts/ssh.sh"
        prepare_ssh "$SECRET_FILE"
