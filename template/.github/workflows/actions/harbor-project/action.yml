name: Ensure private Harbor project
description: Create the project when absent and reject public projects.
inputs:
  harbor_url: { required: true }
  project: { required: true }
  secret_file: { required: true }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HARBOR_URL: ${{ inputs.harbor_url }}
        PROJECT: ${{ inputs.project }}
        SECRET_FILE: ${{ inputs.secret_file }}
      run: |
        set -Eeuo pipefail
        source "$GITHUB_ACTION_PATH/../../scripts/harbor.sh"
        ensure_project "$HARBOR_URL" "$PROJECT" "$SECRET_FILE"
