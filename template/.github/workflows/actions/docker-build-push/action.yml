name: Build and push Docker image
description: Build once and push release plus channel aliases.
inputs:
  image: { required: true }
  version: { required: true }
  environment: { required: true }
  dockerfile: { required: true }
  context: { required: true }
  robot_name: { required: true }
  robot_secret_file: { required: true }
outputs:
  published_tags: 
    value: ${{ steps.push.outputs.published_tags }}
  image_digest: 
    value: ${{ steps.push.outputs.image_digest }}
runs:
  using: composite
  steps:
    - id: push
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        ENVIRONMENT: ${{ inputs.environment }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        CONTEXT: ${{ inputs.context }}
        ROBOT_NAME: ${{ inputs.robot_name }}
        ROBOT_SECRET_FILE: ${{ inputs.robot_secret_file }}
      run: |
        set -Eeuo pipefail
        source "$GITHUB_ACTION_PATH/../../scripts/docker.sh"
        build_push "$IMAGE" "$VERSION" "$ENVIRONMENT" "$DOCKERFILE" "$CONTEXT" "$ROBOT_NAME" "$ROBOT_SECRET_FILE"
