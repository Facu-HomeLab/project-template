name: Build, publish and deploy

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (e.g. v1.2.3-dev.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  BAO_ADDR: ${{ vars.BAO_ADDR || secrets.BAO_ADDR || 'https://key.internal.facuynati.website' }}
  BAO_PATH_PREFIX: ${{ vars.BAO_PATH_PREFIX || secrets.BAO_PATH_PREFIX || 'kv/data/Facu-HomeLab' }}
  BAO_AUDIENCE: ${{ vars.BAO_AUDIENCE || secrets.BAO_AUDIENCE || 'openbao' }}
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || secrets.HARBOR_REGISTRY || 'reg.internal.facuynati.website' }}

jobs:
  deployment:
    name: Build, publish and deploy release
    runs-on: [self-hosted, linux, x64, ephemeral, docker]

    # A job-level environment cannot reference steps.release.outputs because
    # the environment is resolved before any step executes. Derive it from
    # the same release-tag convention used by the release resolver:
    # * -dev.N => dev
    # * -rc.N  => staging
    # * stable => prod
    environment: ${{ contains(inputs.release_tag || github.ref_name, '-dev.') && 'dev' || contains(inputs.release_tag || github.ref_name, '-rc.') && 'staging' || 'prod' }}

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      environment: ${{ steps.release.outputs.environment }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}

    steps:
      # Checkout the release tag, including its workflow scripts.
      # Result: source code and scripts from the exact release.
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Check that all required scripts exist before executing the pipeline.
      # Result: fail early if the release is missing a required script.
      - name: Verify workflow scripts
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh

          require_scripts .github/workflows/scripts \
            common.sh \
            openbao.sh \
            harbor.sh \
            docker.sh \
            ssh.sh \
            deploy.sh \
            cleanup.sh

      # Validate the tag, resolve its commit and derive the environment.
      # Result: tag, SHA, environment, image name and version for later steps.
      - name: Resolve release
        id: release
        shell: bash
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh

          TAG="$RELEASE_TAG"

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+|-rc\.[0-9]+)?$ ]] ||
            die "Invalid release tag: ${TAG}"

          SHA="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")" ||
            die "Tag does not exist or does not reference a valid commit: ${TAG}"

          resolve_release "$TAG" "$GITHUB_REPOSITORY" "$HARBOR_REGISTRY"

          {
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "environment=${ENVIRONMENT}"
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

          log "Release resolved: ${TAG} (${SHA}) - ${ENVIRONMENT}"

      # Build and export the Docker image using the release metadata.
      # Result: Docker image available locally and saved to RUNNER_TEMP/image.tar.
      - name: Build Docker image
        shell: bash
        working-directory: source
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          ENVIRONMENT: ${{ steps.release.outputs.environment }}
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh
          source .github/workflows/scripts/docker.sh

          build_image \
            "$IMAGE" \
            "$VERSION" \
            "$ENVIRONMENT" \
            "Dockerfile" \
            "."

      # Single OpenBao fetch shared by publish, robot, SSH and deploy steps.
      # Result: private JSON secret file; only its path is exposed as an output.
      - name: Load OpenBao configuration
        id: bao
        shell: bash
        working-directory: source
        env:
          ENVIRONMENT: ${{ steps.release.outputs.environment }}
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh
          source .github/workflows/scripts/openbao.sh

          JWT_ROLE="$(resolve_openbao_jwt_role "$ENVIRONMENT")"

          openbao_load_environment_config \
            "$ENVIRONMENT" \
            "$BAO_ADDR" \
            "$BAO_PATH_PREFIX" \
            "$BAO_AUDIENCE" \
            "$JWT_ROLE" \
            "$GITHUB_OUTPUT"

      # Load the image, authenticate with Harbor and push release tags.
      # Result: version, environment and name tags published in Harbor.
      - name: Publish image to Harbor
        shell: bash
        working-directory: source
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          ENVIRONMENT: ${{ steps.release.outputs.environment }}
          SECRET_FILE: ${{ steps.bao.outputs.secret_file }}
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh
          source .github/workflows/scripts/harbor.sh

          docker load --input "${RUNNER_TEMP}/image.tar"

          harbor_login
          harbor_push "$VERSION"

      # Create a temporary Harbor robot with pull-only permissions.
      - name: Create temporary Harbor pull robot
        id: robot
        shell: bash
        working-directory: source
        env:
          SECRET_FILE: ${{ steps.bao.outputs.secret_file }}
          HARBOR_URL: ${{ vars.HARBOR_URL || secrets.HARBOR_URL || format('https://{0}', env.HARBOR_REGISTRY) }}
          ROBOT_SECRET_FILE: ${{ runner.temp }}/ci-cd-state/harbor-robot-secret
          ROBOT_STATE_FILE: ${{ runner.temp }}/ci-cd-state/harbor-robot-state.json
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh
          source .github/workflows/scripts/harbor.sh

          harbor_project "$SECRET_FILE"

          mkdir -p "${RUNNER_TEMP}/ci-cd-state"
          chmod 700 "${RUNNER_TEMP}/ci-cd-state"

          create_robot \
            "${HARBOR_URL}" \
            "${HARBOR_PROJECT}" \
            "${SECRET_FILE}" \
            "gha-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            pull \
            "${ROBOT_SECRET_FILE}" \
            "${ROBOT_STATE_FILE}"

      # Prepare SSH credentials and connection settings.
      - name: Prepare SSH
        id: ssh
        shell: bash
        working-directory: source
        env:
          SECRET_FILE: ${{ steps.bao.outputs.secret_file }}
          SSH_DIR: ${{ runner.temp }}/deployment-ssh
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/ssh.sh

          prepare_ssh "$SECRET_FILE" "$SSH_DIR"

          echo "ssh_dir=${SSH_DIR}" >> "$GITHUB_OUTPUT"

      # Deploy the published release to the target environment.
      # Result: application deployed using the selected release tag.
      - name: Deploy
        shell: bash
        working-directory: source
        env:
          SECRET_FILE: ${{ steps.bao.outputs.secret_file }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SSH_DIR: ${{ steps.ssh.outputs.ssh_dir }}
          ROBOT_SECRET_FILE: ${{ steps.robot.outputs.robot_secret_file }}
          ROBOT_STATE_FILE: ${{ steps.robot.outputs.robot_state_file }}
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh
          source .github/workflows/scripts/deploy.sh

          deploy_release

      # Execute runner cleanup even if an earlier step failed.
      - name: Cleanup
        if: always()
        shell: bash
        working-directory: source
        env:
          HARBOR_URL: ${{ vars.HARBOR_URL || secrets.HARBOR_URL || format('https://{0}', env.HARBOR_REGISTRY) }}
          SECRET_FILE: ${{ steps.bao.outputs.secret_file }}
          ROBOT_STATE_FILE: ${{ runner.temp }}/ci-cd-state/harbor-robot-state.json
          SSH_DIR: ${{ runner.temp }}/deployment-ssh
        run: |
          set -Eeuo pipefail

          source .github/workflows/scripts/common.sh
          source .github/workflows/scripts/cleanup.sh

          # Delete the temporary Harbor robot if it was created.
          # Run in a subshell so a deletion failure does not prevent
          # local credential and artifact cleanup.
          if [[ -s "${ROBOT_STATE_FILE}" ]]; then
            if [[ -n "${SECRET_FILE:-}" && -r "${SECRET_FILE}" ]]; then
              if ! (
                source .github/workflows/scripts/harbor.sh
                delete_robot \
                  "${HARBOR_URL}" \
                  "${SECRET_FILE}" \
                  "${ROBOT_STATE_FILE}"
              ); then
                echo "::warning::Unable to delete the temporary Harbor robot. Manual cleanup may be required."
              fi
            else
              echo "::warning::Harbor robot state exists, but administrative credentials are unavailable. Manual cleanup may be required."
            fi
          else
            log "No temporary Harbor robot to delete"
          fi

          # Remove temporary SSH configuration and log out of Harbor.
          cleanup_runner \
            "${HARBOR_REGISTRY:-}" \
            "${SSH_DIR}"

          # Remove temporary robot credentials and metadata.
          rm -f -- \
            "${RUNNER_TEMP}/ci-cd-state/harbor-robot-secret" \
            "${ROBOT_STATE_FILE}"

          # Remove the exported Docker image.
          rm -f -- "${RUNNER_TEMP}/image.tar"

          log "Temporary credentials and build artifact cleanup completed"
