# ============================================================
# Docker Compose - Production Overrides
#
# Usage:
# docker compose \
#   -f deploy/docker-compose.yml \
#   -f deploy/docker-compose.prod.yml \
#   up -d
# ============================================================
include:
  - path: docker-compose.yml

services:
  app:
    environment:
      APP_ENV: production
    volumes:
      - ./src:/src
